# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Resolve APT's mirror transport to the runner's preferred mirror for urllib.
      - name: Configure Ubuntu repositories
        run: |
          mirror=$(awk '/^https?:\/\// { print $1; exit }' /etc/apt/apt-mirrors.txt)
          if [ -z "$mirror" ]; then
            echo "No HTTP(S) mirror found in the runner's APT mirror list" >&2
            exit 1
          fi
          mirror=${mirror%/}
          echo "Using runner APT mirror: $mirror"
          sudo sed -i "s|mirror+file:/etc/apt/apt-mirrors\.txt|$mirror|g" /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources

      # Install pre-requisites
      - name: Install pre-reqs
        run: |
          sudo apt-get update
          sudo apt-get -y install pyqt5-dev-tools man2html-base python3-debianbts python3-requests python3-setuptools
        
      # Runs a single command using the runners shell
      - name: Build tests
        run: make

      - name: Check Debian BTS dependency
        run: python3 -c 'import debianbts; from apt_offline_core import AptOfflineCoreLib; assert AptOfflineCoreLib.debianbts is debianbts'

      - name: Diagnose Ubuntu archive access
        run: python3 tests/ci-archive-diagnostics.py

      # Runs a set of commands using the runners shell
      - name: Linux runtime tests
        run: |
          echo Running tests from tests/ folder
          ./tests/apt-offline-tests-github.sh
